name: Build Create Flightworks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flightworks-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and test
        run: gradle --no-daemon clean build
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: create-flightworks-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
